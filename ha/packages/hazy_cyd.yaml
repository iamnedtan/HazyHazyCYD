# GENERATED by tools/gen_panel.py - edit the generator, not this file.
# Plate name on the device must be "hazycyd" (MQTT topic hasp/hazycyd/...).
#
# Page 2 buttons:
#   - Rename a button: change input_text.cyd_btn_N_label in the HA UI. No reflash.
#     (No "initial:" on purpose - it would reset your label on every HA restart.
#      Empty label falls back to "Button N".)
#   - Change what a button runs: set input_text.cyd_btn_N_entity to an entity ID
#     (script.x, scene.x, light.x ...). It is run with homeassistant.turn_on.
#     Empty = the default from tools/gen_panel.py.

